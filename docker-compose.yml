services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: financepass
      POSTGRES_DB: financeflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # 1. NEW: Redis for Caching
  redis:
    image: redis:alpine
    container_name: financeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 2. NEW: RabbitMQ for Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: financeflow-rabbitmq
    ports:
      - "5672:5672"   # Queue port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  # 3. NEW: Go Microservice Worker
  go-worker:
    build:
      context: ./go-worker # We will create this folder next
      dockerfile: Dockerfile
    container_name: financeflow-go-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.backend
    depends_on:
      - db
      - redis     # Added dependency
      - rabbitmq  # Added dependency
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers"]

  frontend:
    build:
      context: ./financial-app-frontend
      dockerfile: Dockerfile
    env_file:
      - .env.frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redis_data:     # Added volume
  rabbitmq_data:  # Added volume