services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: financepass
      POSTGRES_DB: financeflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers"]

  frontend:
    build:
      context: ./financial-app-frontend
      dockerfile: Dockerfile
    env_file:
      - .env.frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
